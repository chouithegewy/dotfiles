# foot ships Control+plus for font-increase but only Control+minus for
# font-decrease, so Ctrl+Shift+= zooms in while Ctrl+Shift+- (which sends
# Control+underscore) does nothing. Overriding an action replaces its whole
# default list, so the built-in bindings are repeated here alongside the new one.
[key-bindings]
font-decrease=Control+minus Control+underscore Control+KP_Subtract
